[tool.poetry]
name = "truthcheck-backend"
version = "0.1.0"
description = "AI-powered misinformation detector"
authors = ["Your Name <you@email.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
httpx = "^0.27.0"
newspaper3k = "^0.2.8"
playwright = "^1.42.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.1.0"
torch = "^2.2.0"
transformers = "^4.38.0"
sentence-transformers = "^2.5.0"
faiss-cpu = "^1.8.0"
spacy = "^3.7.0"
scikit-learn = "^1.4.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
slowapi = "^0.1.9"
mlflow = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.2.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
